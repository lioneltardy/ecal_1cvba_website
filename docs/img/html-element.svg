<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">

  <!-- Fond -->
  <rect width="640" height="200" fill="#f8f8f8"/>

  <!-- Balise ouvrante -->
  <rect x="40" y="72" width="120" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="104" text-anchor="middle" font-size="18" fill="#1d4ed8">&lt;h1&gt;</text>

  <!-- Contenu -->
  <rect x="200" y="72" width="240" height="56" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="104" text-anchor="middle" font-size="18" fill="#15803d">Blade Runner</text>

  <!-- Balise fermante -->
  <rect x="480" y="72" width="120" height="56" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="104" text-anchor="middle" font-size="18" fill="#1d4ed8">&lt;/h1&gt;</text>

  <!-- Accolade englobante -->
  <line x1="40" y1="148" x2="600" y2="148" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="40" y1="148" x2="40" y2="158" stroke="#94a3b8" stroke-width="1"/>
  <line x1="600" y1="148" x2="600" y2="158" stroke="#94a3b8" stroke-width="1"/>
  <line x1="320" y1="148" x2="320" y2="158" stroke="#94a3b8" stroke-width="1"/>

  <!-- Labels -->
  <text x="100" y="52" text-anchor="middle" font-size="12" fill="#3b82f6" font-family="system-ui, sans-serif">Balise ouvrante</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#22c55e" font-family="system-ui, sans-serif">Contenu</text>
  <text x="540" y="52" text-anchor="middle" font-size="12" fill="#3b82f6" font-family="system-ui, sans-serif">Balise fermante</text>
  <text x="320" y="178" text-anchor="middle" font-size="12" fill="#64748b" font-family="system-ui, sans-serif">Élément HTML</text>

</svg>
